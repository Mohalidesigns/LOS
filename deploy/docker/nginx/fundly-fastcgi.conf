# Every request is handled by Laravel's front controller.
fastcgi_pass fundly_php;
fastcgi_keep_conn on;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/fundly/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/fundly/public;
fastcgi_param HTTP_X_CORRELATION_ID $fundly_correlation_id;
fastcgi_param HTTP_PROXY "";
fastcgi_read_timeout 60s;
fastcgi_hide_header X-Powered-By;
# The edge sets Cache-Control: no-store for every response (PII); drop the upstream value.
fastcgi_hide_header Cache-Control;
