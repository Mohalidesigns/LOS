      security:
      - sessionCookie: []
      - bearerToken: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-fundly_session
      description: Sanctum stateful SPA session (HttpOnly, Secure, SameSite=Strict) + X-XSRF-TOKEN header on unsafe methods.
    bearerToken:
      type: http
      scheme: bearer
      description: Sanctum personal access token for service and partner accounts.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,255}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag from the last read
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,64}$
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageAfter:
      name: page[after]
      in: query
      schema:
        type: string
      description: Opaque cursor from meta.page.next_cursor
  headers:
    ETag:
      schema:
        type: string
      description: Entity tag for If-Match
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlation_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlation_id
      description: RFC 9457 problem details. `type` is a URN from the problem catalogue.
    PageMeta:
      type: object
      properties:
        page:
          type: object
          properties:
            size:
              type: integer
            next_cursor:
              type:
              - string
              - 'null'
            has_more:
              type: boolean
          required:
          - size
          - next_cursor
          - has_more
      required:
      - page
    Money:
      type: object
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{4}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currency
      description: Decimal string at scale 4 + ISO 4217 code. Never a float.
    Scope:
      type: object
      properties:
        legal_entity_ids:
          type: array
          items:
            type: string
            format: uuid
        org_unit_id:
          type:
          - string
          - 'null'
          format: uuid
        product_ids:
          type: array
          items:
            type: string
        currencies:
          type: array
          items:
            type: string
        max_amount:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              amount:
                type: string
              currency:
                type: string
            required:
            - amount
            - currency
        segments:
          type: array
          items:
            type: string
        portfolio_tags:
          type: array
          items:
            type: string
      description: Assignment scope (FR-SEC-005). Empty dimension = unrestricted.
    LoginResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - mfa_required
          - mfa_enrollment_required
          - authenticated
        mfa_enrollment:
          type: object
          properties:
            secret:
              type: string
            otpauth_uri:
              type: string
          required:
          - secret
          - otpauth_uri
        user:
          $ref: '#/components/schemas/Me'
      required:
      - status
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - human
          - service
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        home_legal_entity_id:
          type:
          - string
          - 'null'
          format: uuid
        home_org_unit_id:
          type:
          - string
          - 'null'
          format: uuid
        mfa_enrolled:
          type: boolean
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - kind
      - email
      - name
      - status
      - mfa_enrolled
      - created_at
    Me:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          tenant_id:
            type: string
            format: uuid
          roles:
            type: array
            items:
              type: string
        required:
        - tenant_id
        - roles
    UserCreate:
      type: object
      properties:
        kind:
          type: string
          enum:
          - human
          - service
        email:
          type: string
        name:
          type: string
        password:
          type: string
          description: Humans only; 12+ chars, mixed case, digit, symbol
        home_legal_entity_id:
          type:
          - string
          - 'null'
          format: uuid
        home_org_unit_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - kind
      - email
      - name
    IssuedToken:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
          description: Shown once
        abilities:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - token
      - abilities
      - expires_at
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        is_template:
          type: boolean
        template_key:
          type:
          - string
          - 'null'
        cloned_from_id:
          type:
          - string
          - 'null'
          format: uuid
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - code
      - name
      - is_template
      - permissions
    Permission:
      type: object
      properties:
        code:
          type: string
          pattern: ^[a-z_]+:[a-z_]+$
        resource:
          type: string
        action:
          type: string
        module:
          type: string
        description:
          type: string
        is_sensitive:
          type: boolean
      required:
      - code
      - resource
      - action
      - module
      - is_sensitive
    RoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/Scope'
        valid_from:
          type: string
          format: date-time
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
        granted_by:
          type: string
        change_request_id:
          type:
          - string
          - 'null'
          format: uuid
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - user_id
      - role_id
      - scope
      - valid_from
      - granted_by
    SodRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - permission_pair
          - role_pair
        left:
          type: string
        right:
          type: string
        description:
          type: string
        enabled:
          type: boolean
      required:
      - id
      - kind
      - left
      - right
      - enabled
    SodConflict:
      type: object
      properties:
        rule_id:
          type: string
          format: uuid
        kind:
          type: string
        left:
          type: string
        right:
          type: string
        description:
          type: string
        user_id:
          type: string
          format: uuid
      required:
      - rule_id
      - kind
      - left
      - right
      - user_id
    Delegation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        delegator_id:
          type: string
          format: uuid
        delegate_id:
          type: string
          format: uuid
        role_assignment_id:
          type: string
          format: uuid
        reason:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - delegator_id
      - delegate_id
      - role_assignment_id
      - valid_from
      - valid_to
    ChangeRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action_type:
          type: string
        status:
          type: string
          enum:
          - pending
          - executed
          - rejected
          - cancelled
          - failed_stale
          - failed
        entity_type:
          type:
          - string
          - 'null'
        entity_id:
          type:
          - string
          - 'null'
        payload:
          type: object
        required_checker_permission:
          type: string
        maker_id:
          type: string
          format: uuid
        maker_reason:
          type:
          - string
          - 'null'
        checker_id:
          type:
          - string
          - 'null'
          format: uuid
        decision_reason:
          type:
          - string
          - 'null'
        execution_result:
          type:
          - object
          - 'null'
        created_at:
          type: string
          format: date-time
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        executed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - action_type
      - status
      - payload
      - required_checker_permission
      - maker_id
      - created_at
    EffectiveAccess:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        evaluated_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: object
            properties:
              permission:
                type: string
              sensitive:
                type: boolean
              granted_by:
                type: array
                items:
                  type: object
                  properties:
                    assignment_id:
                      type: string
                      format: uuid
                    role_code:
                      type: string
                    scope:
                      $ref: '#/components/schemas/Scope'
                    delegated_by:
                      type:
                      - string
                      - 'null'
                      format: uuid
                    valid_to:
                      type:
                      - string
                      - 'null'
                      format: date-time
                  required:
                  - assignment_id
                  - role_code
                  - scope
            required:
            - permission
            - granted_by
        assignments:
          type: array
          items:
            type: object
            properties:
              assignment_id:
                type: string
                format: uuid
              role_id:
                type: string
                format: uuid
              role_code:
                type: string
              scope:
                $ref: '#/components/schemas/Scope'
              valid_from:
                type: string
                format: date-time
              valid_to:
                type:
                - string
                - 'null'
                format: date-time
              active:
                type: boolean
              delegated_by:
                type:
                - string
                - 'null'
                format: uuid
              delegation_id:
                type:
                - string
                - 'null'
                format: uuid
            required:
            - assignment_id
            - role_code
            - active
      required:
      - user_id
      - permissions
      - assignments
    LegalEntityCreate:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        jurisdiction:
          type: string
          pattern: ^[A-Z]{2}$
        licence_category:
          type: string
          enum:
          - commercial_bank
          - merchant_bank
        base_currency:
          type: string
          pattern: ^[A-Z]{3}$
        timezone:
          type: string
        org_level_labels:
          type: array
          items:
            type: string
      required:
      - code
      - name
      - jurisdiction
      - licence_category
      - base_currency
      - timezone
      - org_level_labels
    LegalEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        jurisdiction:
          type: string
        licence_category:
          type: string
        base_currency:
          type: string
        timezone:
          type: string
        org_level_labels:
          type: array
          items:
            type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - code
      - name
      - jurisdiction
      - licence_category
      - base_currency
      - timezone
      - org_level_labels
      - status
    OrgUnit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
        code:
          type: string
        name:
          type: string
        depth:
          type: integer
          minimum: 0
        level_label:
          type:
          - string
          - 'null'
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - legal_entity_id
      - parent_id
      - code
      - name
      - depth
      - status
    ConfigArtifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        active_version_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - type
      - key
      - name
      - active_version_id
    ConfigVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - draft
          - in_review
          - approved
          - rejected
          - active
          - superseded
        content:
