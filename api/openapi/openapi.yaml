  /api/v1/config-artifacts/{type}/{artifact}/versions/{version}/actions/{action}:
    post:
      summary: 'Lifecycle action: submit, approve, reject (direct); activate, rollback (maker-checker, 202)'
      operationId: transitionConfigVersion
      tags:
      - Configuration
      x-permission: config:author | config:review | config:activate_request (per action)
      x-idempotency-key: required
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9_.]+$
        description: Configuration type, e.g. security.session_policy
      - name: artifact
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - submit
          - approve
          - reject
          - activate
          - rollback
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      x-step-up: required (default 5 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type:
                  - string
                  - 'null'
      responses:
