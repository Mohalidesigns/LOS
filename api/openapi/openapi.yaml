      operationId: health
      tags:
      - Operations
      x-permission: public
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
        default:
          $ref: '#/components/responses/Problem'
      security: []
