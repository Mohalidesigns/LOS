      x-permission: 'application:view'
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - submit
              - withdraw
              - cancel
              - hold
              - resume
              - return
              - resubmit
              - recommend
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code:
                  type:
                    - string
                    - 'null'
                  pattern: '^[A-Z0-9_]{2,64}$'
                reason_text:
                  type:
                    - string
                    - 'null'
                return_to:
                  type:
                    - string
                    - 'null'
      responses:
        200:
          description: Transitioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
                required:
                  - data
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        default:
          $ref: '#/components/responses/Problem'
      security:
        - sessionCookie: []
        - bearerToken: []
      x-idempotency-key: required
      description: 'The command checks the action-specific permission: application:originate (submit, hold, resume, resubmit, withdraw, cancel) or application:recommend (recommend, return). withdraw, cancel, hold and return need reason_code.'
