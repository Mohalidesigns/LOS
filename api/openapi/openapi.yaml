      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  maxLength: 1024
              required:
              - email
              - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
                required:
                - data
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/auth/mfa/verify:
