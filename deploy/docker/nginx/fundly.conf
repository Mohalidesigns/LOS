# Fundly LOS API edge (nginx in front of php-fpm). API-only: no static UI is
# served from this host. TLS terminates here (FR-SEC-016); certificates are
# mounted read-only from the installation's PKI, never baked into images.

upstream fundly_php {
    server api:9000;
    keepalive 16;
}

# Correlation id: honour a client-supplied X-Correlation-Id, else nginx's id.
map $http_x_correlation_id $fundly_correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

log_format fundly_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
  '"upstream_time":"$upstream_response_time","correlation_id":"$fundly_correlation_id",'
  '"user_agent":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=fundly_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=fundly_api:10m rate=50r/s;

server {
    listen 80;
    # listen [::]:80;   (enable where the host has IPv6)
    server_name _;
    # Only health probes over plain HTTP (internal load balancer); everything else redirects.
    location = /health { access_log off; include /etc/nginx/fundly-fastcgi.conf; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FundlyTLS:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 30s;

    access_log /dev/stdout fundly_json;
    error_log  /dev/stderr warn;

    # Security headers (TRD §8). API responses are JSON; the CSP forbids everything.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;

    root /var/www/fundly/public;

    location = /api/v1/auth/login {
        limit_req zone=fundly_login burst=10 nodelay;
        include /etc/nginx/fundly-fastcgi.conf;
    }

    location /api/v1/ {
        limit_req zone=fundly_api burst=100 nodelay;
        include /etc/nginx/fundly-fastcgi.conf;
    }

    location = /health { access_log off; include /etc/nginx/fundly-fastcgi.conf; }
    location = /ready  { access_log off; include /etc/nginx/fundly-fastcgi.conf; }

    # Nothing else is exposed (no UI, no static files, no dotfiles).
    location / { return 404; }
}
