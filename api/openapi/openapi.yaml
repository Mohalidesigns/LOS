# Fundly LOS — OpenAPI 3.1 contract (source of truth, TRD §10.1). Generated layout; edit freely.
openapi: 3.1.0
info:
  title: Fundly LOS API
  version: 1.0.0-p0
  summary: 'Loan origination system for Nigerian commercial banks: Phase 0 foundation.'
  description: 'Design-first contract for /api/v1 (TRD §10). Conventions:


    - **Auth**: staff use a same-origin Sanctum session cookie (+ XSRF token); service and partner principals use bearer tokens whose abilities
    can only narrow their role assignments.

    - **Idempotency-Key** is required on every POST that creates or causes an effect (`x-idempotency-key: required`). A replay returns the stored
    response (header `Idempotent-Replayed: true`); the same key with a different body returns 409 `idempotency-key-reused`.

    - **Concurrency**: resources carry `ETag`; PATCH requires `If-Match` (428 if missing, 412 if stale).

    - **Errors**: RFC 9457 `application/problem+json` with `type` (URN), `code`, `correlation_id`, and `errors` for validation failures.

    - **Lists**: cursor pagination with `page[size]` (≤ 100) and `page[after]`; scope filtering is always applied.

    - **Tracing**: `X-Correlation-Id` is accepted or generated and always echoed.

    - **Maker-checker** actions answer 202 with the change request; nothing changes until a different user approves it.

    - `x-permission` names the permission checked at the route; `x-step-up` marks operations needing a re-authentication within 5 minutes.

    '
  license:
    name: Proprietary (Atheris Limited)
    identifier: LicenseRef-Atheris-Proprietary
servers:
- url: https://{host}
  variables:
    host:
      default: los.bank.example
